  name: Android CI & Build APK

  on:
    push:
      branches:
        - "master"
        - "main"
      tags:
        - "v*"

    pull_request:
      branches:
        - "master"
        - "main"

    workflow_dispatch:

  # GitHub Actions 权限
  permissions:
    contents: write

  jobs:
    build:
      name: Build & Package APK
      runs-on: ubuntu-latest

      steps:

        # ============================================================
        # 1. Checkout
        # ============================================================
        - name: Checkout Code
          uses: actions/checkout@v4


        # ============================================================
        # 2. 设置 JDK 17
        # ============================================================
        - name: Set up JDK 17
          uses: actions/setup-java@v4
          with:
            java-version: "17"
            distribution: "temurin"
            cache: gradle


        # ============================================================
        # 3. 设置 Gradle
        # ============================================================
        - name: Setup Gradle
          uses: gradle/actions/setup-gradle@v4


        # ============================================================
        # 4. Gradle Wrapper 执行权限
        # ============================================================
        - name: Grant execute permission for gradlew
          run: chmod +x ./gradlew


        # ============================================================
        # 5. 检查 GitHub Secrets
        #
        # 不再提供任何默认密码
        # Secrets 缺失时直接终止构建
        # ============================================================
        - name: Validate Signing Secrets
          env:
            KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
            KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
            KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
            KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          run: |
            set -e
            
            if [ -z "$KEYSTORE_BASE64" ]; then
              echo "::error::KEYSTORE_BASE64 is not configured."
              exit 1
            fi
            
            if [ -z "$KEYSTORE_PASSWORD" ]; then
              echo "::error::KEYSTORE_PASSWORD is not configured."
              exit 1
            fi
            
            if [ -z "$KEY_ALIAS" ]; then
              echo "::error::KEY_ALIAS is not configured."
              exit 1
            fi
            
            if [ -z "$KEY_PASSWORD" ]; then
              echo "::error::KEY_PASSWORD is not configured."
              exit 1
            fi
            
            echo "Signing secrets are configured."
        

        # ============================================================
        # 6. 恢复 Android 签名文件
        # ============================================================
        - name: Decode Keystore
          env:
            KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          run: |
            set -e
            
            mkdir -p app
            
            echo "$KEYSTORE_BASE64" | base64 --decode > app/app.jks
            
            if [ ! -s app/app.jks ]; then
              echo "::error::Failed to create app/app.jks"
              exit 1
            fi
            
            echo "Keystore restored successfully."
        

        # ============================================================
        # 7. 验证 Keystore
        #
        # 不输出密码
        # 只验证 JKS 是否有效以及 Alias 是否存在
        # ============================================================
        - name: Verify Keystore
          env:
            KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
            KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          run: |
            set -e
            
            keytool -list \
              -keystore app/app.jks \
              -storepass "$KEYSTORE_PASSWORD" \
              -alias "$KEY_ALIAS" \
              > /dev/null
            
            echo "Keystore and alias verified successfully."
        

        # ============================================================
        # 8. Build Release + Debug APK
        #
        # 只执行一次，删除原来重复的 Build APK 步骤
        # ============================================================
        - name: Build APK
          env:
            KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
            KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
            KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          run: |
            ./gradlew assembleRelease assembleDebug --stacktrace
        

        # ============================================================
        # 9. 显示生成的 APK
        # ============================================================
        - name: List APK Files
          run: |
            echo "Generated APK files:"
            find app/build/outputs/apk -type f -name "*.apk" -print
        

        # ============================================================
        # 10. 上传 Debug APK
        # ============================================================
        - name: Upload Debug APK
          uses: actions/upload-artifact@v4
          with:
            name: Weather-Debug-APK
            path: app/build/outputs/apk/debug/*.apk
            if-no-files-found: error


        # ============================================================
        # 11. 上传 Release APK
        # ============================================================
        - name: Upload Release APK
          uses: actions/upload-artifact@v4
          with:
            name: Weather-Release-APK
            path: app/build/outputs/apk/release/*.apk
            if-no-files-found: error


        # ============================================================
        # 12. Tag v* 时自动创建 GitHub Release
        #
        # 例如：
        # v1.0.0
        # v1.1.0
        # v2.0.0
        # ============================================================
        - name: Create GitHub Release
          if: startsWith(github.ref, 'refs/tags/v')
          uses: softprops/action-gh-release@v2
          with:
            files: |
              app/build/outputs/apk/release/*.apk
              app/build/outputs/apk/debug/*.apk
            generate_release_notes: true
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


        # ============================================================
        # 13. 清理签名文件
        #
        # 避免后续步骤意外使用
        # ============================================================
        - name: Cleanup Keystore
          if: always()
          run: |
            rm -f app/app.jks
    
