name: Android CI & Build APK

on:
  push:
    branches: [ "master", "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

# 设置工作流的默认权限
permissions:
  contents: write

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      # 检出代码仓库
      - name: Checkout Code
        uses: actions/checkout@v4

      # 配置 JDK 17 编译环境
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 配置 Gradle 运行环境及依赖缓存
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # 为 gradlew 赋予执行权限
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 从 Secrets 中动态解码生成签名文件（若已配置 RELEASE_KEYSTORE_BASE64）
      - name: Decode Keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > app/app.jks
          fi

      # 执行编译并打包 Release 与 Debug APK
      - name: Build APK with Gradle
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD || 'zy123456789' }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS || 'app.jks' }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD || 'zy123456789' }}
        run: |
          ./gradlew assembleRelease assembleDebug --stacktrace

      # 上传 Debug APK 至 GitHub Actions Artifacts
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Weather-Debug-APK
          path: app/build/outputs/apk/debug/*.apk

      # 上传 Release APK 至 GitHub Actions Artifacts
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Weather-Release-APK
          path: app/build/outputs/apk/release/*.apk

      # 推送 Release Tag (例如 v1.1.3) 时自动创建 GitHub Release 并附带 APK
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
