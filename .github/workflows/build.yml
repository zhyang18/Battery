name: Android CI & Build Signed APK

on:
  push:
    branches: [ "**" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Sign APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Grant execute permission for gradlew
        run: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
          else
            gradle wrapper
            chmod +x gradlew
          fi

      - name: Build APKs with Gradle
        run: ./gradlew assembleRelease assembleDebug --stacktrace

      - name: Sign Release APK
        id: sign_apk
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -e
          mkdir -p output_apks

          # 1. 查找生成的 Release APK
          UNSIGNED_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$UNSIGNED_APK" ]; then
            echo "Error: Release APK not found!"
            exit 1
          fi
          echo "Found release apk: $UNSIGNED_APK"

          SIGNED_APK="output_apks/Battery-release-signed.apk"
          KEYSTORE_FILE="release.keystore"

          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using custom Keystore from GitHub Secrets..."
            echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_FILE"
            ALIAS="${KEY_ALIAS:-battery}"
            KS_PASS="${KEYSTORE_PASSWORD:-123456}"
            KEY_PASS="${KEY_PASSWORD:-$KS_PASS}"
          else
            echo "Generating a release keystore for signing..."
            ALIAS="battery"
            KS_PASS="android123"
            KEY_PASS="android123"
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -alias "$ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$KS_PASS" \
              -keypass "$KEY_PASS" \
              -dname "CN=BatteryApp, OU=App, O=Battery, L=City, ST=State, C=CN"
          fi

          # 定位 Android SDK 中的 apksigner 和 zipalign
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_SDK_ROOT/build-tools/* | sort -V | tail -n 1)
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"
          ZIPALIGN="$BUILD_TOOLS_DIR/zipalign"

          echo "Using build tools from: $BUILD_TOOLS_DIR"

          # 对齐 APK
          ALIGNED_APK="app/build/outputs/apk/release/Battery-aligned.apk"
          $ZIPALIGN -v -p 4 "$UNSIGNED_APK" "$ALIGNED_APK"

          # 使用 apksigner 进行 V2 + V3 签名
          $APKSIGNER sign --ks "$KEYSTORE_FILE" \
            --ks-key-alias "$ALIAS" \
            --ks-pass "pass:$KS_PASS" \
            --key-pass "pass:$KEY_PASS" \
            --out "$SIGNED_APK" \
            "$ALIGNED_APK"

          # 验证签名有效性
          $APKSIGNER verify -v "$SIGNED_APK"

          # 2. 拷贝 Debug APK 作为备用安装包
          DEBUG_APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -n "$DEBUG_APK" ]; then
            cp "$DEBUG_APK" "output_apks/Battery-debug.apk"
          fi

          # 清理临时 keystore
          rm -f "$KEYSTORE_FILE" "$ALIGNED_APK"

          echo "APK 构建与签名全部完成！"
          ls -la output_apks/

      - name: Upload APKs to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Battery-APK
          path: output_apks/*.apk
          retention-days: 30

      - name: Release APK to GitHub Releases
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'Latest Continuous Build' }}
          body: |
            ## 电池检测 (Battery App) 自动构建发布
            - **提交哈希**: `${{ github.sha }}`
            - **包含文件**:
              - `Battery-release-signed.apk`: 经由 apksigner (V2+V3) 签名的正式发布版 APK
              - `Battery-debug.apk`: 调试版 APK
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          files: |
            output_apks/Battery-release-signed.apk
            output_apks/Battery-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
